{
  "name": "Build Orange Synth",
  "on": ["push", "workflow_dispatch"],
  "jobs": { "build-windows": { "runs-on": "windows-latest", "steps": [
    { "uses": "actions/checkout@v4" },
    { "name": "Configure", "run": "cmake -B build -G \"Visual Studio 17 2022\" -A x64" },
    { "name": "Build", "run": "cmake --build build --config Release --parallel" },
    { "name": "Collect plugin", "shell": "pwsh", "run": "New-Item -ItemType Directory -Force -Path dist | Out-Null; $vst = Get-ChildItem -Path build -Recurse -Directory -Filter \"*.vst3\" | Select-Object -First 1; if (-not $vst) { throw \"No .vst3 produced\" }; Copy-Item -Recurse $vst.FullName (\"dist/\" + $vst.Name); Copy-Item INSTALL.txt dist/INSTALL.txt" },
    { "uses": "actions/upload-artifact@v4", "with": { "name": "Orange-Synth-VST3-Windows", "path": "dist" } }
  ] } }
}
